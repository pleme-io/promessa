[workspace]
resolver = "2"
members = ["promessa-types", "promessa-store", "promessa-eval", "promessa-runtime", "promessa-rpc", "promessa-graphql", "promessa-rest", "promessa-mcp", "promessa-cli", "promessa", "camelot-posture-controller"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/promessa"
authors = ["pleme-io"]

[workspace.dependencies]
# Internal members carry BOTH `path` and `version`. The version is not
# redundant: cargo builds from the path locally, but a release REFUSES a
# manifest whose dependency has no version requirement —
#
#   error: failed to verify manifest at camelot-posture-controller/Cargo.toml
#     all dependencies must have a version requirement specified when
#     publishing. dependency `promessa-types` does not specify a version
#
# which is exactly how ten of this workspace's eleven members failed to ship on
# 2026-08-04, while `promessa-types` — the ONE member with no internal deps —
# went out fine. The release was honestly red about it; the manifests were the
# problem. `cargo set-version` maintains these on bump, so they track the
# workspace version automatically. Do not strip them back to a bare path.
promessa-types = { path = "promessa-types", version = "0.1.3" }
promessa-store = { path = "promessa-store", version = "0.1.3" }
promessa-eval = { path = "promessa-eval", version = "0.1.3" }
promessa-runtime = { path = "promessa-runtime", version = "0.1.3" }
promessa-rpc = { path = "promessa-rpc", version = "0.1.3" }
promessa-graphql = { path = "promessa-graphql", version = "0.1.3" }
promessa-rest = { path = "promessa-rest", version = "0.1.3" }
promessa-mcp = { path = "promessa-mcp", version = "0.1.3" }
promessa = { path = "promessa", version = "0.1.3" }
camelot-posture-controller = { path = "camelot-posture-controller", version = "0.1.3" }
# pleme-io sibling deps — git so CI works without checking out
# every sibling. Local dev: .cargo/config.toml [patch.<url>] override.
# tatara-lisp is a published crates.io crate — the derive macros are re-exported
# from the lib (as DeriveTataraDomain / DeriveKeywordSexp), so a consumer must
# NOT name tatara-lisp-derive itself.
tatara-lisp = { version = "0.3.3" }
# crates.io, not git. A `git` dep with `branch = "main"` and no `version` is
# not merely untidy — crates.io REFUSES to accept a crate carrying one, so
# every one of these lines was a hard block on ever releasing this workspace.
# That is why `promessa-types` is 404 on crates.io while ten of its eleven
# sibling crates are published, and why engenho's move to registry deps
# (`c33e5d3`) broke: it depended on a crate this workspace could not ship.
# All six resolve from the registry as of 2026-08-04.
shikumi = { version = "0.1" }
shigoto = { version = "0.1" }
shigoto-types = { version = "0.1" }
shigoto-dag = { version = "0.1" }
cofre-types = { version = "0.1" }
tameshi = { version = "0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_yaml = { version = "0.9" }
schemars = { version = "0.8", features = ["derive", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
async-trait = { version = "0.1" }
thiserror = { version = "2" }
anyhow = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = { version = "1" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
tonic = { version = "0.12" }
prost = { version = "0.13" }
tonic-build = { version = "0.12" }
prost-build = { version = "0.13" }
async-graphql = { version = "7" }
async-graphql-axum = { version = "7" }
axum = { version = "0.7" }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
kube = { version = "0.96", features = ["derive", "runtime", "client", "rustls-tls"] }
kube-runtime = { version = "0.96" }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
petgraph = { version = "0.6" }
clap = { version = "4", features = ["derive", "env"] }
futures = { version = "0.3" }
proptest = { version = "1" }
tempfile = { version = "3" }

[workspace.lints]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
